name: Node

on:
  workflow_dispatch:
    inputs:
      version:
        description: PasarGuard node release label
        required: true
        default: v0.5.5
      base_digest:
        description: Reviewed official multi-platform image sha256 digest
        required: true
        default: sha256:5f41e456ad68c84f42855b41eb41d69a79e8b3795bbe6a739ed74c4627eaa99b
      publish:
        description: Publish the generic image after validation
        type: boolean
        default: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.27.3
  GOMAXPROCS: 4

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Check immutable inputs
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ inputs.base_digest }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "NODE_BASE=ghcr.io/pasarguard/node@$DIGEST" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'

      - name: Download pinned official clients and fixtures
        run: bash .github/scripts/official-clients.sh "$RUNNER_TEMP/official"

      - name: Validate before building or publishing
        run: |
          bash .github/scripts/validate-release.sh "$RUNNER_TEMP/official"

      - name: Build and identify Xray
        env:
          CGO_ENABLED: 0
          GOOS: linux
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            GOARCH=$arch go build -o dist/xray-$arch -trimpath -buildvcs=false -gcflags="all=-l=4" -ldflags="-X github.com/xtls/xray-core/core.build=$GITHUB_SHA -s -w -buildid=" ./main
          done
          dist/xray-amd64 version
          sha256sum dist/xray-* go.mod go.sum > dist/sha256sums.txt
          jq -n --arg source "$GITHUB_SHA" --arg base "$NODE_BASE" --arg go "$(go version)" \
            '{source:$source,official_node_base:$base,toolchain:$go,supervisor:"unmodified official PasarGuard; only Xray is replaced"}' > dist/build-manifest.json

      - uses: docker/setup-buildx-action@v4

      - name: Build local validation image
        uses: docker/build-push-action@v7
        with:
          context: dist
          file: .github/docker/node.Dockerfile
          platforms: linux/amd64
          build-args: NODE_BASE=${{ env.NODE_BASE }}
          load: true
          push: false
          tags: xray-node-validation:local

      - name: Check packaged executable before publication
        run: |
          docker run --rm --entrypoint /usr/local/bin/xray xray-node-validation:local version | tee dist/packaged-version.txt
          expected="$(sha256sum dist/xray-amd64 | cut -d ' ' -f1)"
          actual="$(docker run --rm --entrypoint sha256sum xray-node-validation:local /usr/local/bin/xray | cut -d ' ' -f1)"
          test "$actual" = "$expected"

      - name: Preserve validated binaries and receipts
        uses: actions/upload-artifact@v7
        with:
          name: xray-node-${{ github.sha }}
          path: dist/

      - name: Name immutable candidate tag
        if: inputs.publish
        env:
          VERSION: ${{ inputs.version }}
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pasarguard-node:$VERSION-xray-$GITHUB_SHA" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4.6.0
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This generic image preserves the official supervisor. Fleet-specific
      # supervisor changes belong to the consuming infrastructure repository.
      - name: Publish validated generic image
        id: publish
        if: inputs.publish
        uses: docker/build-push-action@v7
        with:
          context: dist
          file: .github/docker/node.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: NODE_BASE=${{ env.NODE_BASE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
          tags: ${{ env.IMAGE }}

      - name: Record result
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "Validated source: \`$GITHUB_SHA\`; Go 1.27.3; official base: \`$NODE_BASE\`." >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DIGEST" ]; then
            echo "Immutable image digest: \`$DIGEST\`. Tag: \`$IMAGE\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Validation only; no image published." >> "$GITHUB_STEP_SUMMARY"
          fi
